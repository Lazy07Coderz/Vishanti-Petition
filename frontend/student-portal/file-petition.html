<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a Petition | The Vishanti Petition</title>
    <link rel="stylesheet" href="petition.css">
</head>
<body>
<h1>File a Petition</h1>
<p>Describe your concern so it can be reviewed.</p>
<form id="petition-form">

    <label for="petition-title">Petition Title</label>
    <input
        type="text"
        id="petition-title"
        name="title"
        required
    >

    <label for="petition-category">Category</label>
    <select id="petition-category" name="category" required>
        <option value="">Select a category</option>
        <option value="Academics">Academics</option>
        <option value="Hostel & Facilities">Hostel & Facilities</option>
        <option value="Library">Library</option>
        <option value="Other">Other</option>
    </select>

    <label for="petition-description">Description</label>
    <textarea
        id="petition-description"
        name="description"
        required
    ></textarea>

    <button type="submit">Submit Petition</button>

</form>
<script src="petition.js"></script>
</body>
</html>
